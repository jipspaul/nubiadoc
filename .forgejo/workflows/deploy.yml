# Déploiement continu vers le LXC de test (Alpine x86_64) à CHAQUE merge sur main.
#
# Le runner Forgejo est arm64 (Mac/k3s) et la cible amd64 : on NE construit donc
# PAS via QEMU (rustc segfault sous l'émulation libkrun). À la place :
#   - l'API Rust est CROSS-compilée en binaire musl statique amd64 (cargo-zigbuild,
#     pas de QEMU) directement sur le runner ;
#   - les 3 fronts Flutter sont buildés en web (statique, indépendant de l'arch) ;
#   - tout est poussé sur le LXC, qui assemble l'image API (COPY-only) en amd64
#     NATIF et (re)démarre la stack podman.
#
# Tourne dans `flutter-ci:stable` (déjà présente sur le runner) + installe la
# chaîne de cross-compilation Rust au runtime, MISE EN CACHE entre les runs
# (cargo-zigbuild, rustup, zig, deps + target) -> 1er run lent, suivants rapides.
# Secrets Forgejo requis : DEPLOY_HOST, DEPLOY_USER, DEPLOY_PASSWORD.
# Secret optionnel : YOUSIGN_API_KEY (#5688 — absent tant qu'aucun compte
# Yousign n'est provisionné : `POST /v1/quotes/:id/signature` répond alors
# 502 upstream_unavailable, cf. `yousign_client.rs`).
# Secrets optionnels : SCW_ACCESS_KEY/SCW_SECRET_KEY/SCW_BUCKET (#6250 — même
# symptôme que #5688 mais sur le signer de stockage : sans eux, `GET
# /v1/documents/:id` et `/download` répondent 502 upstream_unavailable pour
# 100% des documents, cf. `scaleway_storage_signer.rs`).
# Secrets optionnels CADDY_HOST/CADDY_USER/CADDY_PASSWORD (#6162) : sans eux,
# l'application auto du bloc Caddy reservation.doc.nubia-link.com sur l'hôte
# Caddy (hors LXC) est sautée — le collage manuel du snippet reste requis.
# Variable optionnelle : NUBIA_API_BASE (défaut http://<DEPLOY_HOST>:3000).
on:
  push:
    branches: [main]
    # Un changement purement documentaire ne déclenche PAS de déploiement.
    paths-ignore:
      - '**.md'
      - 'qa/**'
      - 'docs/**'
      - 'design/**'

concurrency:
  group: deploy-${{ github.ref }}
  # Postmortem 2026-06-27 : avec `cancel-in-progress: true`, Forgejo Actions
  # cancel le run en cours avant d'évaluer `paths-ignore` sur le nouveau push.
  # Quand le QA agent met à jour `qa/explored-paths.md` (paths-ignore matched),
  # il cancel quand même le deploy précédent → net 0 deploy run, badge rouge
  # éternel. cancel-in-progress=false fait l'inverse : le nouveau push attend
  # le precedent. Le deploy étant idempotent (podman rm/run), c'est sûr.
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: docker
    container:
      image: flutter-ci:stable
    steps:
      - uses: actions/checkout@v4

      - name: "Garde-fou : collision de numérotation des migrations (récidive #4854/#5485, cf. #6128)"
        run: bash db/scripts/check_migration_numbering.sh db/migrations

      - name: Pre-flight LXC reachability (retries, then FAIL loud if down)
        id: preflight
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          # Postmortem #3493 : l'ancien comportement (skip silencieux + job VERT quand
          # le LXC est injoignable) a masqué une panne de ~17h — 7+ déploiements
          # « réussis » en 6-15s qui ne déployaient RIEN, et des issues fermées à tort
          # sur la seule base du merge. Un faux vert est pire qu'un rouge honnête.
          # Nouveau : on RETRY (blips réseau runner→LXC), puis on ÉCHOUE FORT (badge
          # rouge visible) si vraiment injoignable, au lieu de skipper en silence.
          # Test TCP simple via /dev/tcp (bash built-in, pas de paquet à installer).
          ok=""
          for attempt in 1 2 3 4 5; do
            if timeout 6 bash -c "echo > /dev/tcp/${DEPLOY_HOST}/22" 2>/dev/null; then
              ok="yes"
              echo "✅ LXC ${DEPLOY_HOST}:22 joignable (tentative ${attempt}) — déploiement"
              break
            fi
            echo "… tentative ${attempt}/5 : ${DEPLOY_HOST}:22 injoignable, retry dans 10s"
            sleep 10
          done
          if [ -z "$ok" ]; then
            echo "::error::LXC ${DEPLOY_HOST}:22 INJOIGNABLE depuis le runner après 5 tentatives — DÉPLOIEMENT NON EFFECTUÉ (job en échec volontaire, cf. #3493). Vérifier : (1) LXC allumée + sshd actif ; (2) route réseau runner→LXC (le runner k3s/conteneur doit atteindre le port 22 du LXC) ; (3) secret DEPLOY_HOST correct. Une fois réparé, re-run ce workflow."
            exit 1
          fi
          echo "reachable=true" >> "$GITHUB_OUTPUT"

      # On cache la toolchain + les dépendances TÉLÉCHARGÉES (registry/git/bin,
      # rustup, zig) — jamais périmées pour un même Cargo.lock — mais PLUS
      # `api/target` (artefacts compilés). Le garder faisait tourner un binaire
      # PÉRIMÉ après un fix backend (le cache rejouait un binaire déjà « à jour »)
      # → réservation cassée en prod malgré le merge. Sans lui : recompilation
      # fraîche à CHAQUE déploiement (deps cachées = reste rapide), binaire à jour.
      - name: Cache toolchain Rust + deps (PAS api/target — évite binaire périmé)
        if: steps.preflight.outputs.reachable == 'true'
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            ~/.rustup
            /opt/zig
          key: deploy-rust-${{ hashFiles('api/Cargo.lock') }}
          restore-keys: |
            deploy-rust-

      - name: Toolchain (sautée si en cache)
        if: steps.preflight.outputs.reachable == 'true'
        run: |
          set -e
          export PATH="$HOME/.cargo/bin:$PATH"
          export DEBIAN_FRONTEND=noninteractive
          # Paquets système (non cachables : fs du conteneur recréé à chaque run)
          apt-get update -qq
          apt-get install -y --no-install-recommends curl xz-utils ca-certificates git sshpass openssh-client tar
          # Rust + cible musl (cachés via ~/.cargo + ~/.rustup)
          command -v cargo >/dev/null 2>&1 || curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          # `~/.cargo/env` n'est PAS dans le cache (juste ~/.cargo/bin), donc
          # quand le cache restore cargo le file env est absent → sourcing
          # crash en `set -e`. Source uniquement si présent (PATH déjà set).
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env" || true
          rustup target list --installed 2>/dev/null | grep -qx x86_64-unknown-linux-musl || rustup target add x86_64-unknown-linux-musl
          # Zig (caché via /opt/zig) ; le symlink est recréé à chaque run (hors cache)
          if [ ! -x /opt/zig/zig ]; then
            curl -sSL "https://ziglang.org/download/0.13.0/zig-linux-$(uname -m)-0.13.0.tar.xz" -o /tmp/zig.tar.xz
            mkdir -p /opt/zig && tar -xJf /tmp/zig.tar.xz -C /opt/zig --strip-components=1
          fi
          ln -sf /opt/zig/zig /usr/local/bin/zig
          # cargo-zigbuild (caché via ~/.cargo/bin) — c'est le plus long à compiler
          command -v cargo-zigbuild >/dev/null 2>&1 || cargo install cargo-zigbuild
          zig version && cargo zigbuild --help >/dev/null && sshpass -V

      - name: Build + déploiement vers le LXC
        if: steps.preflight.outputs.reachable == 'true'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          API_BASE: ${{ vars.NUBIA_API_BASE }}
          YOUSIGN_API_KEY: ${{ secrets.YOUSIGN_API_KEY }}
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_BUCKET: ${{ secrets.SCW_BUCKET }}
          CADDY_HOST: ${{ secrets.CADDY_HOST }}
          CADDY_USER: ${{ secrets.CADDY_USER }}
          CADDY_PASSWORD: ${{ secrets.CADDY_PASSWORD }}
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          [ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env" || true
          bash infra/deploy/build-and-deploy.sh
