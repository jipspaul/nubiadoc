# mobile-distribute — publie les 4 apps sur Firebase App Distribution.
#
# Déclenché à CHAQUE merge sur main (comme deploy.yml) + manuellement.
# Les secrets de signature/upload viennent d'Infisical (machine identity).
#
# Activation : poser la variable de repo MOBILE_DISTRIBUTE_ENABLED=true.
# Tant qu'elle n'est pas "true", les jobs sont skippés (pas de deploy rouge).
#
# ⚠️ CONTRAINTE D'ARCHITECTURE (postmortem 2026-07-09, cf. run #19278) :
#   Le runner Forgejo `docker` est arm64 (Lima/k3s). Or une dépendance tire
#   `jni`/`jni_flutter` (C++ natif compilé via NDK+cmake) :
#     - le cmake du SDK Android est un binaire x86_64 -> sur arm64 le shell ne
#       peut PAS l'exécuter (`cmake: 1: Syntax error: ")" unexpected`) ;
#     - le NDK Linux n'a pas de host linux-aarch64 -> le clang planterait aussi.
#   => Le build Android NATIF est impossible sur ce runner arm64 sans émulation
#      x86 (que l'infra évite exprès, cf. `deploy.yml`).
#   Le job `android` est donc gaté derrière ANDROID_CI_ENABLED (comme `ios` l'est
#   derrière IOS_CI_ENABLED) : il ne s'exécute QUE si un runner x86_64 existe.
#   Sinon il est SKIPPÉ (gris, pas rouge). En attendant, distribue en LOCAL sur
#   un Mac :  cd front && bundle exec fastlane android distribute_all
#
# Variables de repo (Settings > Actions > Variables) :
#   MOBILE_DISTRIBUTE_ENABLED = true
#   ANDROID_CI_ENABLED        = true   (SEULEMENT si un runner x86_64 est dispo ;
#                               le runner arm64 ne peut pas builder l'Android natif)
#   IOS_CI_ENABLED            = true   (SEULEMENT si un runner macOS est enregistré)
#   INFISICAL_API_URL         = http://<host-joignable-par-le-runner>:8080
#                               (ex. http://host.docker.internal:8080 pour le job
#                                docker, ou l'IP LAN de la machine Infisical)
#   INFISICAL_PROJECT_ID      = ce1ea05e-202c-470d-9bc6-32aeb0d2217d
#   MACOS_RUNNER_LABELS       = ["self-hosted","macos"]  (JSON, ton runner iOS)
# Secrets de repo (Settings > Actions > Secrets) :
#   INFISICAL_CLIENT_ID       = <client id de la machine identity>
#   INFISICAL_CLIENT_SECRET   = <client secret de la machine identity>
#
# Secrets attendus DANS Infisical (projet nubiadoc, env prod) :
#   FIREBASE_SERVICE_ACCOUNT  (JSON du service account, rôle App Distribution Admin)
#   MATCH_PASSWORD, MATCH_GIT_URL, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_CONTENT,
#   FASTLANE_TEAM_ID, FAD_TESTERS, API_BASE_URL   (déjà présents)
#   POSTHOG_API_KEY           (lu par les lanes Fastlane pour l'upload mapping
#                              Android / dSYM iOS)
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'qa/**'
      - 'docs/**'
      - 'design/**'
  workflow_dispatch:
    inputs:
      app:
        description: "app à distribuer (nom ou 'all')"
        required: true
        default: "all"

concurrency:
  group: mobile-distribute-${{ github.ref }}
  cancel-in-progress: false

env:
  INFISICAL_PROJECT_ID: ${{ vars.INFISICAL_PROJECT_ID }}
  INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
  INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
  APP_INPUT: ${{ github.event.inputs.app || 'all' }}
  # Infisical est self-hosted et bindé sur localhost de la machine hôte.
  # - job docker : y accède via host.docker.internal
  # - job macOS (hors conteneur) : via localhost
  # Surchargeable par la variable de repo INFISICAL_API_URL si besoin.

jobs:
  android:
    # Nécessite un runner x86_64 : le runner docker arm64 ne peut PAS builder
    # l'Android natif (cmake/NDK x86_64-only + dépendance jni). Activer avec
    # ANDROID_CI_ENABLED=true UNE FOIS qu'un runner x86_64 est enregistré ;
    # sinon le job est skippé (en attendant, distribution Android en local).
    if: ${{ vars.MOBILE_DISTRIBUTE_ENABLED == 'true' && vars.ANDROID_CI_ENABLED == 'true' }}
    runs-on: docker
    container:
      image: flutter-ci:stable
    env:
      # Infisical tourne dans le cluster (namespace infisical) : le job (pod k8s
      # / dind) l'atteint via le DNS de service in-cluster. host.docker.internal
      # NE marche PAS ici (runner k8s, pas Docker Desktop).
      INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL || 'http://infisical-infisical-standalone-infisical.infisical.svc.cluster.local:8080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Installer l'outil infisical
        run: |
          if ! command -v infisical >/dev/null 2>&1; then
            curl -1sLf 'https://artifacts-cli.infisical.com/setup.deb.sh' | bash
            apt-get update && apt-get install -y infisical
          fi
          infisical --version

      - name: Auth Infisical (machine identity) + matérialiser le service account
        working-directory: front
        run: |
          export INFISICAL_TOKEN="$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --domain="$INFISICAL_API_URL" --plain --silent)"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"
          mkdir -p fastlane/.secrets
          infisical secrets get FIREBASE_SERVICE_ACCOUNT --plain --silent \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod --domain="$INFISICAL_API_URL" \
            --token="$INFISICAL_TOKEN" > fastlane/.secrets/nubiadoc-fastlane.json
          test -s fastlane/.secrets/nubiadoc-fastlane.json
          echo "POSTHOG_API_KEY=$(infisical secrets get POSTHOG_API_KEY --plain --silent \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod --domain="$INFISICAL_API_URL" \
            --token="$INFISICAL_TOKEN")" >> "$GITHUB_ENV"

      - name: Dépendances
        working-directory: front
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4
          flutter pub get

      - name: Distribuer Android
        working-directory: front
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/fastlane/.secrets/nubiadoc-fastlane.json"
          LANE="distribute_all"; [ "$APP_INPUT" != "all" ] && LANE="distribute app:$APP_INPUT"
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod \
            --domain="$INFISICAL_API_URL" --token="$INFISICAL_TOKEN" -- \
            bundle exec fastlane android $LANE

  ios:
    # Nécessite un runner macOS enregistré : activer avec IOS_CI_ENABLED=true
    # (sinon le job resterait en attente indéfiniment).
    if: ${{ vars.MOBILE_DISTRIBUTE_ENABLED == 'true' && vars.IOS_CI_ENABLED == 'true' }}
    runs-on: ${{ vars.MACOS_RUNNER_LABELS && fromJSON(vars.MACOS_RUNNER_LABELS) || 'macos' }}
    env:
      # Sur un runner macOS hors cluster : localhost via port-forward, ou une URL
      # d'Infisical joignable depuis ce runner (variable INFISICAL_API_URL).
      INFISICAL_API_URL: ${{ vars.INFISICAL_API_URL || 'http://localhost:8080' }}
    steps:
      - uses: actions/checkout@v4

      - name: Auth Infisical + matérialiser le service account
        working-directory: front
        run: |
          export INFISICAL_TOKEN="$(infisical login --method=universal-auth \
            --client-id="$INFISICAL_CLIENT_ID" --client-secret="$INFISICAL_CLIENT_SECRET" \
            --domain="$INFISICAL_API_URL" --plain --silent)"
          echo "INFISICAL_TOKEN=$INFISICAL_TOKEN" >> "$GITHUB_ENV"
          mkdir -p fastlane/.secrets
          infisical secrets get FIREBASE_SERVICE_ACCOUNT --plain --silent \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod --domain="$INFISICAL_API_URL" \
            --token="$INFISICAL_TOKEN" > fastlane/.secrets/nubiadoc-fastlane.json
          # clé App Store Connect écrite sur disque pour fastlane
          infisical secrets get ASC_KEY_CONTENT --plain --silent \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod --domain="$INFISICAL_API_URL" \
            --token="$INFISICAL_TOKEN" > fastlane/.secrets/asc.p8
          echo "POSTHOG_API_KEY=$(infisical secrets get POSTHOG_API_KEY --plain --silent \
            --projectId="$INFISICAL_PROJECT_ID" --env=prod --domain="$INFISICAL_API_URL" \
            --token="$INFISICAL_TOKEN")" >> "$GITHUB_ENV"

      - name: Dépendances
        working-directory: front
        run: |
          bundle config set --local path vendor/bundle
          bundle install --jobs 4
          flutter pub get

      - name: Distribuer iOS
        working-directory: front
        # Le runner macOS doit avoir : Xcode, accès SSH à MATCH_GIT_URL (nubia_cert),
        # cocoapods. ASC_KEY_FILEPATH pointe sur la clé matérialisée ci-dessus.
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$PWD/fastlane/.secrets/nubiadoc-fastlane.json"
          export ASC_KEY_FILEPATH="$PWD/fastlane/.secrets/asc.p8"
          LANE="distribute_all"; [ "$APP_INPUT" != "all" ] && LANE="distribute app:$APP_INPUT"
          infisical run --projectId="$INFISICAL_PROJECT_ID" --env=prod \
            --domain="$INFISICAL_API_URL" --token="$INFISICAL_TOKEN" -- \
            bundle exec fastlane ios $LANE
