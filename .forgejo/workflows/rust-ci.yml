on: [pull_request]

# Cancel old in-progress runs when new commits push to the same PR/branch.
# Saves runner time on auto-rebase + force-push cycles.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # ── Gate bloquant : format + lint + COMPILATION des tests ──────────────────
  # Fiable (pas de base, pas d'exécution de test) → conditionne le merge.
  # clippy --all-targets + `cargo test --no-run` garantissent que tout le code
  # ET tous les tests d'intégration COMPILENT — ça attrape la grande majorité
  # des régressions sans dépendre de l'exécution (flaky) de la suite DB.
  rust:
    runs-on: docker
    container:
      image: rust-ci:stable
    steps:
      - uses: actions/checkout@v4
      - name: Format
        working-directory: api
        run: cargo fmt --all -- --check
      - name: Clippy
        working-directory: api
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Compile tests (sans exécuter)
        working-directory: api
        run: cargo test --workspace --all-features --no-run

  # ── Job NON bloquant : suite d'intégration DB (informatif) ─────────────────
  # Provisionne Postgres+PostGIS inline (rust-ci n'a pas le binaire ; services:
  # a un DNS cassé sur ce runner — cf. db.yml) + migrations via le db/Makefile,
  # puis exécute les ~1000 tests d'intégration. Ils sont encore instables (vrais
  # bugs + interférence sur base partagée), donc ce job N'ÉCHOUE JAMAIS le merge :
  # `continue-on-error` au niveau job + `|| true` sur le step. Les échecs sont
  # dans le log, à fiabiliser test par test (voir issue de suivi).
  rust-integration:
    runs-on: docker
    container:
      image: rust-ci:stable
    continue-on-error: true
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGDATA: /tmp/pgdata
      DATABASE_URL: postgres://nubia_owner@localhost:5432/nubia
      APP_DATABASE_URL: postgres://nubia_app@localhost:5432/nubia
      SEED_DATABASE_URL: postgres://nubia_seed@localhost:5432/nubia
    steps:
      - uses: actions/checkout@v4
      - name: Provisionne Postgres + PostGIS inline
        run: |
          set -e
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends postgresql postgresql-postgis make
          PGVER=$(ls /usr/lib/postgresql/ | sort -n | tail -1)
          echo "/usr/lib/postgresql/$PGVER/bin" >> "$GITHUB_PATH"
          export PATH="/usr/lib/postgresql/$PGVER/bin:$PATH"
          rm -rf "$PGDATA" && mkdir -p "$PGDATA" && chown postgres:postgres "$PGDATA"
          su postgres -c "initdb -D $PGDATA --auth-host=trust --auth-local=trust -U postgres" >/dev/null
          su postgres -c "pg_ctl -D $PGDATA -l /tmp/pg.log -o \"-c listen_addresses='localhost'\" -w start"
          for i in $(seq 1 30); do pg_isready -h localhost -U postgres -q && break; sleep 1; done
          pg_isready -h localhost -U postgres
      - name: Schéma + rôles (db/ reset + migrate)
        working-directory: db
        run: make reset migrate
      - name: Tests d'intégration (NON bloquant — échecs dans le log)
        working-directory: api
        run: cargo nextest run --workspace --all-features --no-fail-fast || true
