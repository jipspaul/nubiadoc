# Flutter test workflow — runs in front/ (Dart pub workspace + Melos 7 embedded).
#
# Layout: front/ holds a native Dart pub workspace (pubspec.yaml has `workspace:`)
# with 3 apps (app_patient, app_practicien, app_secretariat) + 5 packages
# (nubia_a2ui/core/data/design_system/domain). Melos config is INLINE in
# front/pubspec.yaml (Melos 7 dropped the standalone melos.yaml).
#
# Uses custom flutter-ci image baked with Flutter SDK (arm64-friendly via Cirrus
# Labs build) + Node.js (required by Forgejo Actions for actions/checkout@v4).
# Build & load the image into the runner DinD with:
#   ./ci/flutter/load-into-runner.sh
#
# Image is local-only (loaded into DinD via docker load, not pushed to any
# registry). The runner config has force_pull: false so it uses the local cache.
on: [pull_request]

# Cancel old in-progress runs when new commits push to the same PR/branch.
# Saves runner time on auto-rebase + force-push cycles.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  flutter-test:
    runs-on: docker
    container:
      image: flutter-ci:stable
    steps:
      - uses: actions/checkout@v4
      - name: Flutter version
        working-directory: front
        run: flutter --version
      - name: Pub get (workspace root resolves all members)
        working-directory: front
        run: flutter pub get
      - name: Analyze (melos)
        working-directory: front
        run: dart run melos analyze
      - name: Test (melos — packages with test/ dir)
        working-directory: front
        run: dart run melos test
