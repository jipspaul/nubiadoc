name: nubia_workspace
description: Nubia Flutter monorepo — patient / praticien / secrétariat apps + shared packages.
publish_to: none

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

# The workspace contains Flutter packages, so the root must itself be a Flutter package —
# otherwise IDE tooling runs plain `dart pub get` at the root and fails to resolve the Flutter
# SDK that members (nubia_core, nubia_design_system, …) require. This `flutter` dep makes the
# resolver use `flutter pub get`; the root ships no app code of its own.
dependencies:
  flutter:
    sdk: flutter

# Native Dart pub workspace: one lockfile, one .dart_tool for all members.
workspace:
  - packages/nubia_domain
  - packages/nubia_design_system
  - packages/nubia_core
  - packages/nubia_data
  - packages/nubia_a2ui
  - packages/nubia_app_shell
  - packages/nubia_test_harness
  - apps/app_patient
  - apps/app_pharmacie
  - apps/app_practicien
  - apps/app_secretariat

dev_dependencies:
  melos: ^7.0.0

# Melos 7 reads its config from here (the standalone melos.yaml is no longer
# supported). Workspace members are taken from the `workspace:` key above.
melos:
  name: nubia
  scripts:
    analyze:
      run: dart analyze .
      description: Static analysis across the whole workspace.
    test:
      exec: flutter test
      packageFilters: { dirExists: test }
      description: Run tests in every package that has a test dir.
    format:
      run: dart format .
      description: Format all Dart code in the workspace.
    generate:
      exec: dart run build_runner build --delete-conflicting-outputs
      packageFilters: { dependsOn: ["build_runner"] }
      description: Run build_runner in every member that depends on it (nubia_data, …).
    clean:
      exec: flutter clean
      description: flutter clean across all members.
    upgrade:
      run: dart pub upgrade
      description: Upgrade dependencies for the whole workspace (single shared lockfile).
    e2e:
      run: cd test/e2e && npx playwright test --config=e2e.config.ts {args}
      description: "Lance les tests E2E Playwright multi-rôle. Ex: melos run e2e -- --grep _smoke"
