name: nubia_workspace
description: Nubia Flutter monorepo — patient / praticien / secrétariat apps + shared packages.
publish_to: none

environment:
  sdk: ^3.6.0

# Native Dart pub workspace: one lockfile, one .dart_tool for all members.
workspace:
  - packages/nubia_domain
  - packages/nubia_design_system
  - packages/nubia_core
  - packages/nubia_data
  - packages/nubia_a2ui
  - apps/app_patient
  - apps/app_practicien
  - apps/app_secretariat

dev_dependencies:
  melos: ^7.0.0

# Melos 7 reads its config from here (the standalone melos.yaml is no longer
# supported). Workspace members are taken from the `workspace:` key above.
melos:
  name: nubia
  scripts:
    analyze:
      run: dart analyze .
      description: Static analysis across the whole workspace.
    test:
      exec: flutter test
      packageFilters: { dirExists: test }
      description: Run tests in every package that has a test dir.
    format:
      run: dart format .
      description: Format all Dart code in the workspace.
