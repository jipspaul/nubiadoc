SPECIFICATION TraceSpec

\* Trace `req` fields are JSON strings, so Requests is a set of strings here
\* (no symmetry needed for trace replay; MC.cfg uses model values instead).
CONSTANTS
    Requests = {"r1", "r2", "r3"}

\* Safety invariants that must hold on every REAL execution (no fault
\* injection during trace replay). SingleRefreshInFlight is structural and
\* should always hold; NoLostRetry is the bug-family invariant — on a buggy
\* real trace it WILL be violated, which is exactly what we want trace
\* validation to surface.
INVARIANT TypeOK
INVARIANT SingleRefreshInFlight
INVARIANT NoLostRetry

\* Whole trace must be consumed.
PROPERTY TraceMatched
