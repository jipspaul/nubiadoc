\* Hunting config for Bug Family 1 (brief §6.1 MC1):
\* "With >=2 requests sharing one interceptor, does a concurrent 401 get
\*  dropped (failed) even though the refresh it raced succeeds?"
\*
\* Tight bounds: MaxRefreshFail = 0 so the refresh ALWAYS succeeds — this
\* isolates the lost-retry mechanism (a request failing on the success path,
\* not because the refresh genuinely failed). Target invariant only.
SPECIFICATION MCSpec

CONSTANTS
    Requests = {r1, r2, r3}
    MaxRefreshFail = 0

SYMMETRY Symmetry
VIEW View

\* Target bug-family invariant (EXPECTED TO FAIL → counterexample = the bug).
INVARIANT NoLostRetry

\* Keep a core structural invariant alongside the target.
INVARIANT SingleRefreshInFlight
