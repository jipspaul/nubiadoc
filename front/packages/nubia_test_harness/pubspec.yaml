publish_to: none
version: 0.1.0
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  get_it: ^8.0.0
  nubia_design_system:
    path: ../nubia_design_system
  nubia_core:
    path: ../nubia_core
  nubia_domain:
    path: ../nubia_domain

dev_dependencies:
  flutter_lints: ^5.0.0
