<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Nubia Patient">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Nubia · Patient</title>
  <link rel="manifest" href="manifest.json">
  <style>
    #nubia-loading {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #ffffff;
      font-family: sans-serif;
      color: #1a1a2e;
      gap: 16px;
      z-index: 9999;
    }
    #nubia-loading p { margin: 0; font-size: 16px; }
    #nubia-loading span { font-size: 24px; font-weight: 600; }
  </style>
</head>
<body>
  <div id="nubia-loading">
    <span>Nubia · Patient</span>
    <p>Chargement en cours…</p>
  </div>
  <script>
    // Guard: certains navigateurs fournissent une locale BCP47 invalide qui
    // provoque un RangeError dans le runtime Dart avant tout rendu.
    // On valide via Intl.getCanonicalLocales() et on replie sur 'fr' si nécessaire.
    (function () {
      try {
        if (!navigator.language || !Intl.getCanonicalLocales(navigator.language).length) {
          throw new RangeError('locale vide');
        }
      } catch (_) {
        try {
          Object.defineProperty(Navigator.prototype, 'language', {
            get: function () { return 'fr'; },
            configurable: true,
          });
          Object.defineProperty(Navigator.prototype, 'languages', {
            get: function () { return ['fr', 'fr-FR']; },
            configurable: true,
          });
        } catch (_) { /* lecture seule dans certains environnements */ }
      }
    })();
  </script>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('nubia-loading');
      if (el) el.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
