name: app_patient
description: Nubia patient app (mobile-first, web/desktop/mobile).
publish_to: none
version: 0.1.1+1
resolution: workspace

environment:
  sdk: ^3.6.0
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  flutter_bloc: ^9.1.0
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  equatable: ^2.0.5
  characters: ^1.3.0
  go_router: ^15.1.0
  get_it: ^8.0.0
  dartz: ^0.10.1
  intl: ^0.20.2
  nubia_design_system:
    path: ../../packages/nubia_design_system
  nubia_domain:
    path: ../../packages/nubia_domain
  nubia_core:
    path: ../../packages/nubia_core
  nubia_data:
    path: ../../packages/nubia_data
  nubia_a2ui:
    path: ../../packages/nubia_a2ui
  firebase_messaging: ^15.2.0
  qr_flutter: ^4.1.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  nubia_test_harness:
    path: ../../packages/nubia_test_harness

flutter:
  uses-material-design: true
