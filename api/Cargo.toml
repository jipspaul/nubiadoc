[workspace]
members = [
  "crates/core/config",
  "crates/core/tenancy",
  "crates/core/crypto",
  "crates/integrations/hl7v2",
]
resolver = "2"

[workspace.dependencies]
axum        = { version = "0.7", features = ["multipart"] }
serde_json  = "1"
tower       = { version = "0.4", features = ["util"] }
sqlx        = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
uuid        = { version = "1", features = ["v4", "serde"] }
tokio       = { version = "1", features = ["full"] }
serde       = { version = "1", features = ["derive"] }
chrono      = "0.4"
thiserror   = "1"
tracing     = "0.1"
anyhow      = "1"
async-trait = "0.1"

[package]
name    = "nubia-api"
version = "0.1.1"
edition = "2021"
publish = false

[dependencies]
axum        = { workspace = true, features = ["ws"] }
tokio       = { workspace = true }
tower       = { workspace = true }
tower-http  = { version = "0.5", features = ["cors"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
sqlx        = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
tracing     = { workspace = true }
anyhow      = { workspace = true }
async-trait = { workspace = true }
totp-rs      = { version = "5", features = ["gen_secret"] }
jsonwebtoken = "9"
argon2       = { version = "0.5", features = ["std", "password-hash"] }
hmac         = "0.12"
sha2         = "0.10"
hex          = "0.4"
base64       = "0.22"
reqwest      = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum-client-ip = "0.6"
core-tenancy = { path = "crates/core/tenancy" }
integrations-hl7v2 = { path = "crates/integrations/hl7v2" }
# Lot B10 : chargement des certs/clé PEM (fichiers) pour le listener MLLP et
# type `TlsAcceptor` — mêmes versions que `integrations-hl7v2` (backend
# crypto `ring`, cf. son Cargo.toml pour le choix détaillé).
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1.15"
rustls-pemfile   = "2"

[dev-dependencies]
tokio-tungstenite = "0.24"
futures-util      = { version = "0.3", default-features = false, features = ["sink"] }
rcgen             = "0.14"
rustls            = { version = "0.23.41", default-features = false, features = ["std", "tls12", "ring"] }
