[package]
name    = "integrations-hl7v2"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
thiserror = { workspace = true }
tokio     = { workspace = true }
# Backend crypto `ring` explicitement choisi (pas `aws-lc-rs`, le défaut de
# certaines features rustls) : c'est déjà le backend résolu ailleurs dans le
# workspace (`api/Cargo.lock` : rustls 0.23.41 + rustls-webpki 0.103 + ring
# 0.17.14, via `reqwest`'s `rustls-tls`), et `ring` a un historique de
# cross-compilation musl (via `cargo-zigbuild`, cf. `.forgejo/workflows/deploy.yml`)
# plus éprouvé que `aws-lc-rs`, qui vendorise et compile du C/asm — plus
# fragile sous `zig cc` pour un target musl. Voir `src/tls.rs` pour le détail.
rustls           = { version = "0.23.41", default-features = false, features = ["std", "tls12", "ring"] }
tokio-rustls     = { version = "0.26", default-features = false, features = ["ring"] }
rustls-pki-types = "1.15"
sha2             = "0.10"
hex              = "0.4"

[dev-dependencies]
rcgen = "0.14"
