# Sert les 3 bundles Flutter web (statique) sur 3 ports distincts.
# Chaque app est servie à la racine de son port (base-href "/") avec fallback
# SPA. Monté dans le conteneur nginx:alpine sur /etc/nginx/conf.d/default.conf
# (remplace la conf stock qui écoute sur :80).
server {
    listen 8081;
    server_name _;
    root /www/patient;
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 8082;
    server_name _;
    root /www/praticien;
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 8083;
    server_name _;
    root /www/secretary;
    location / { try_files $uri $uri/ /index.html; }
}
