# Sert les 3 bundles Flutter web (statique) sur 3 ports distincts.
# Chaque app est servie à la racine de son port (base-href "/") avec fallback
# SPA. Monté dans le conteneur nginx:alpine sur /etc/nginx/conf.d/default.conf
# (remplace la conf stock qui écoute sur :80).
#
# flutter_service_worker.js + deploy.json servis en no-store : le navigateur
# récupère toujours la dernière version (le SW auto-destructeur évince un ancien
# SW périmé ; deploy.json reflète le commit réellement déployé).
map $uri $nubia_nocache {
    default                       "";
    ~*/flutter_service_worker\.js "no-store";
    ~*/deploy\.json               "no-store";
}

server {
    listen 8081;
    server_name _;
    root /www/patient;
    add_header Cache-Control $nubia_nocache;
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 8082;
    server_name _;
    root /www/praticien;
    add_header Cache-Control $nubia_nocache;
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 8083;
    server_name _;
    root /www/secretary;
    add_header Cache-Control $nubia_nocache;
    location / { try_files $uri $uri/ /index.html; }
}
