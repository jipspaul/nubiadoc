# Sert les 5 bundles Flutter web (statique) sur 5 ports distincts.
# Chaque app est servie à la racine de son port (base-href "/") avec fallback
# SPA. Monté dans le conteneur nginx:alpine sur /etc/nginx/conf.d/default.conf
# (remplace la conf stock qui écoute sur :80).
#
# Anti-cache périmé après déploiement : les bundles Flutter web (index.html,
# main.dart.js, flutter_bootstrap.js…) ne portent PAS de hash dans leur nom, donc
# sans en-tête ils étaient mis en cache heuristiquement par le navigateur → il
# resservait un vieux bundle après un deploy. On force la revalidation partout
# (`no-cache` = le navigateur peut cacher mais DOIT revalider via etag → 304 si
# inchangé, frais sinon). service_worker + deploy.json en no-store (jamais cachés).
map $uri $nubia_nocache {
    default                       "no-cache";
    ~*/flutter_service_worker\.js "no-store";
    ~*/deploy\.json               "no-store";
}

# #7746 : ces 5 vhosts servaient un index.html statique sans aucun en-tête de
# sécurité — encadrables tels quels dans une <iframe> tierce (clickjacking sur
# les écrans de connexion ET, une fois authentifié, sur des actions à un clic
# comme "Signer le devis"). `always` : ces en-têtes doivent aussi accompagner
# les réponses d'erreur (404 de la fallback SPA), pas seulement les 200.
server {
    listen 8081;
    server_name _;
    root /www/patient;
    add_header Cache-Control $nubia_nocache;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    location / { try_files $uri $uri/ /index.html; }
}
