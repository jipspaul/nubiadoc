# Sert les 3 bundles Flutter web (statique) sur 3 ports distincts.
# Chaque app est servie à la racine de son port (base-href "/") avec fallback
# SPA. Monté dans le conteneur nginx:alpine sur /etc/nginx/conf.d/default.conf
# (remplace la conf stock qui écoute sur :80).
#
# Anti-cache périmé après déploiement : les bundles Flutter web (index.html,
# main.dart.js, flutter_bootstrap.js…) ne portent PAS de hash dans leur nom, donc
# sans en-tête ils étaient mis en cache heuristiquement par le navigateur → il
# resservait un vieux bundle après un deploy. On force la revalidation partout
# (`no-cache` = le navigateur peut cacher mais DOIT revalider via etag → 304 si
# inchangé, frais sinon). service_worker + deploy.json en no-store (jamais cachés).
map $uri $nubia_nocache {
    default                       "no-cache";
    ~*/flutter_service_worker\.js "no-store";
    ~*/deploy\.json               "no-store";
}

server {
    listen 8081;
    server_name _;
    root /www/patient;
    add_header Cache-Control $nubia_nocache;
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 8082;
    server_name _;
    root /www/praticien;
    add_header Cache-Control $nubia_nocache;
    location / { try_files $uri $uri/ /index.html; }
}
server {
    listen 8083;
    server_name _;
    root /www/secretary;
    add_header Cache-Control $nubia_nocache;
    location / { try_files $uri $uri/ /index.html; }
}
